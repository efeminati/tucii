<style>
:root{
  --bg:#0d0a14; --panel:#120e24; --panel2:#2a2150; --ink:#1b1530;
  --fg:#f4f0ea; --muted:#9a8fb8;
  --pink:#ff6fa0; --yellow:#ffd35c; --mint:#5fe0b8; --red:#e8434f; --blue:#5aa7f0;
  --f-pix:'Press Start 2P','Courier New',monospace;
  --f-body:'Pixelify Sans','Courier New',monospace;
  --f-term:'VT323','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 72px;min-height:100vh;-webkit-font-smoothing:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:85;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,rgba(0,0,0,0) 1px 3px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px dashed var(--yellow);outline-offset:6px}
canvas.pxc{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;user-select:none}
@keyframes blink{50%{opacity:0}}
.px4{box-shadow:-4px 0 0 0 var(--fg),4px 0 0 0 var(--fg),0 -4px 0 0 var(--fg),0 4px 0 0 var(--fg)}
.btn{font-family:var(--f-pix);font-size:11px;line-height:1.5;letter-spacing:.03em;color:var(--ink);background:var(--yellow);border:0;padding:12px 14px;margin:6px;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 #d9902a,inset 4px 4px 0 0 #fff0b0}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px)}
.btn.pink{background:var(--pink);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 #c43f74,inset 4px 4px 0 0 #ffc2d6}
.btn.mint{background:var(--mint);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 #2fa883,inset 4px 4px 0 0 #c4f7e6}
.btn:disabled{background:#3b3160;color:#7d72a3;cursor:default;transform:none;filter:none;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 #2a2248,inset 4px 4px 0 0 #4b4078}
.btn.ready{animation:readyp 1s steps(2) infinite}
@keyframes readyp{50%{filter:brightness(1.25)}}
#tap{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-content:center;justify-items:center;gap:20px;cursor:pointer;padding:24px}
#tap .t{font-family:var(--f-pix);font-size:clamp(14px,4vw,22px);color:var(--yellow);animation:blink 1s steps(1) infinite;margin:0}
#tap small{font-family:var(--f-pix);font-size:9px;color:#6f6590;letter-spacing:.08em}

#tap.gone{opacity:0;pointer-events:none;transition:opacity .6s steps(4)}
#intro{position:relative;z-index:1;max-width:760px;margin:5vh auto 0;font-family:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,'Courier New',monospace;font-size:clamp(16px,3.8vw,22px);font-weight:500;line-height:1.5;color:#ececec;min-height:62vh;-webkit-font-smoothing:antialiased}
#intro p{margin:0 0 .35em;white-space:pre-wrap;word-break:break-word}
.cursor{display:inline;margin-left:1px;animation:blink 1s steps(1) infinite}
#coinWrap{margin-top:36px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.coinbtn{display:inline-flex;align-items:center;gap:14px;font-family:var(--f-pix);font-size:clamp(13px,3.4vw,17px);color:var(--yellow);background:none;border:0;padding:10px 4px;animation:blink 1.1s steps(1) infinite}
.coinbtn:disabled{animation:none;color:var(--mint)}
.coinbtn canvas{width:28px;image-rendering:pixelated}
.credit{font-family:var(--f-pix);font-size:10px;color:#8a7fb0;margin:0;letter-spacing:.1em}
#app{max-width:860px;margin:0 auto}
.era,.note{display:none!important}
h1{font-family:var(--f-pix);font-size:clamp(16px,4.4vw,28px);line-height:1.5;color:var(--yellow);text-shadow:3px 3px 0 #b13e53;margin:0 0 12px;word-break:break-word}
.note{font-family:var(--f-body);font-size:clamp(17px,3vw,21px);color:#cfc6e6;margin:0 0 24px}
.stage{position:relative;margin:4px;background:#000;box-shadow:-4px 0 0 0 var(--fg),4px 0 0 0 var(--fg),0 -4px 0 0 var(--fg),0 4px 0 0 var(--fg)}
.stage.tall{height:min(76svh,620px);min-height:440px}
.dlg{position:relative;margin:28px 4px 0;padding:16px 18px 22px;background:var(--panel);font-family:var(--f-body);font-size:clamp(17px,2.8vw,21px);line-height:1.4;min-height:4.6em;
  box-shadow:-4px 0 0 0 var(--fg),4px 0 0 0 var(--fg),0 -4px 0 0 var(--fg),0 4px 0 0 var(--fg),inset 0 0 0 4px #2a2150}
.dlg::after{content:"▼";position:absolute;right:14px;bottom:6px;font-size:11px;color:var(--yellow);animation:blink 1s steps(1) infinite}
.skip{display:block;margin:14px 4px 0;background:none;border:0;padding:4px 0;color:#5a5078;font-family:var(--f-pix);font-size:8px;letter-spacing:.1em;text-decoration:underline;text-underline-offset:4px}
.scr{position:relative;overflow:hidden;background:#000}
.ov{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);margin-top:-12px;font-family:var(--f-pix);font-size:9px;line-height:1.3;white-space:nowrap;background:#fff;color:var(--ink);padding:6px 7px;
  box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink);z-index:2}
.bub::after{content:"";position:absolute;left:50%;bottom:-9px;width:6px;height:6px;margin-left:-3px;background:#fff;box-shadow:0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.flash{position:absolute;inset:0;background:#fff;animation:fl .6s steps(4) forwards;pointer-events:none;z-index:4}
@keyframes fl{from{opacity:1}to{opacity:0}}
.mv{background:var(--panel)}
.route canvas{display:block;width:100%;image-rendering:pixelated}
.cities{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:14px 12px 12px}
.cities::-webkit-scrollbar{display:none}
.city{display:inline-flex;align-items:center;gap:6px;flex:none;font-family:var(--f-pix);font-size:9px;color:#5a5078;padding:6px 3px}
.city.done{color:var(--pink)}
.city.on{color:var(--yellow);font-size:11px}
.city+.city::before{content:"";display:inline-block;width:10px;height:2px;background:#3b3160;margin:0 6px 0 2px}
.city.done+.city::before{background:var(--pink)}
.trk{width:24px;image-rendering:pixelated;animation:bump .4s steps(2) infinite}
@keyframes bump{50%{transform:translateY(-2px)}}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 12px 12px}
.rhead strong{font-family:var(--f-pix);font-size:clamp(12px,3vw,15px);color:var(--yellow);font-weight:400}
.rhead span{font-family:var(--f-body);font-size:15px;color:var(--muted)}
.mini{padding:0 12px 14px;transition:opacity .3s steps(3)}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:12px 4px 0}
.hbar{display:flex;align-items:center;gap:12px;padding:14px 8px 2px;font-family:var(--f-pix);font-size:9px;color:var(--muted)}
.hbar .bar{flex:1;max-width:260px;height:12px;background:#000;box-shadow:-3px 0 0 0 var(--fg),3px 0 0 0 var(--fg),0 -3px 0 0 var(--fg),0 3px 0 0 var(--fg)}
.hbar .bar b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--mint) 0 6px,#3db892 6px 8px)}
.hbar .bar.red b{background:repeating-linear-gradient(90deg,var(--red) 0 6px,#b52d3a 6px 8px)}
.nb{margin:18px 4px 4px;background:#f4f0ea;color:var(--ink);padding:16px 16px 18px;
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 26px,#a8c4e8 26px 28px);
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 6px 0 0 0 #f2a5b4}
.nbtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-pix);font-size:9px;color:#7a6f96;margin-bottom:10px}
.stars{display:flex;gap:4px}.stars canvas{width:20px;image-rendering:pixelated}
.q{font-family:var(--f-pix);font-size:clamp(16px,4.6vw,22px);margin:6px 0 14px;line-height:1.5}
.rem{font-family:var(--f-body);font-size:18px;color:#c0306a;min-height:1.6em;margin:10px 4px 0}
.btn.opt{font-size:14px;min-width:70px;background:#fff;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 #d5cfe4,inset 4px 4px 0 0 #fff}
.btn.opt.good{background:var(--mint)}
.btn.opt.wrong{background:#ffb3b3;animation:nope .3s steps(3)}
@keyframes nope{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}
.phone{margin:18px 4px 4px;background:#0a0816;padding:12px;box-shadow:-4px 0 0 0 #6f6590,4px 0 0 0 #6f6590,0 -4px 0 0 #6f6590,0 4px 0 0 #6f6590}
.phone .top{font-family:var(--f-pix);font-size:9px;color:var(--muted);padding-bottom:8px;margin-bottom:8px;border-bottom:3px dashed #2a2150}
.chat{display:flex;flex-direction:column;gap:12px;min-height:40px}
.msgb{max-width:80%;font-family:var(--f-body);font-size:17px;padding:8px 11px;line-height:1.3;
  box-shadow:-3px 0 0 0 currentColor,3px 0 0 0 currentColor,0 -3px 0 0 currentColor,0 3px 0 0 currentColor}
.msgb.me{align-self:flex-end;background:#3b2f66;color:#cbbcff}
.msgb.me span{color:#fff}
.msgb.her{align-self:flex-start;background:#f4f0ea;color:#6f6590}
.msgb.her span{color:var(--ink)}
.typing{align-self:flex-start;font-family:var(--f-pix);font-size:10px;color:var(--muted);animation:blink .6s steps(1) infinite}
.sw{display:flex;gap:6px;flex-wrap:wrap;padding:14px 4px 4px}
.swb{width:38px;height:38px;border:0;margin:4px;box-shadow:-3px 0 0 0 var(--fg),3px 0 0 0 var(--fg),0 -3px 0 0 var(--fg),0 3px 0 0 var(--fg)}
.swb[aria-pressed="true"]{box-shadow:-4px 0 0 0 var(--yellow),4px 0 0 0 var(--yellow),0 -4px 0 0 var(--yellow),0 4px 0 0 var(--yellow),inset 0 0 0 3px var(--ink)}
.joke{font-family:var(--f-body);font-size:18px;color:var(--yellow);min-height:2.6em;margin:10px 6px 4px}
.cake3d{position:absolute;inset:0}
.cake3d canvas.gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab;image-rendering:pixelated}
.cake3d canvas.conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;image-rendering:pixelated}
.cakeui{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2;pointer-events:none}
.cakeui>*{pointer-events:auto}
.tagpx{font-family:var(--f-pix);font-size:9px;background:#000;color:#fff;padding:9px 10px;margin:4px;box-shadow:-3px 0 0 0 var(--fg),3px 0 0 0 var(--fg),0 -3px 0 0 var(--fg),0 3px 0 0 var(--fg)}
.wish{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:var(--f-pix);font-size:clamp(18px,5.4vw,34px);color:var(--yellow);text-shadow:4px 4px 0 #b13e53;z-index:2;pointer-events:none;opacity:0}
.wish.on{opacity:1;animation:blink .8s steps(1) 5}
.modal{position:fixed;inset:0;z-index:88;background:rgba(5,3,12,.86);display:grid;place-items:center;padding:18px;overflow:auto}
.card{position:relative;background:#f4f0ea;color:var(--ink);max-width:430px;width:100%;padding:22px 20px 20px;margin:6px;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-8px 0 0 0 var(--fg),8px 0 0 0 var(--fg),0 -8px 0 0 var(--fg),0 8px 0 0 var(--fg)}
.card canvas{display:block;width:96px;margin:0 auto 10px;image-rendering:pixelated}
.card h3{font-family:var(--f-pix);font-size:13px;line-height:1.6;text-align:center;margin:0 0 14px;color:#b13e53}
.card p{font-family:var(--f-body);font-size:17px;margin:0 0 .7em}
.card .sig{font-family:var(--f-pix);font-size:10px;text-align:right;margin:14px 0 0}
.card .x{position:absolute;right:10px;top:10px;background:none;border:0;font-family:var(--f-pix);font-size:9px;color:#7a6f96}
.card img{display:block;max-width:100%;max-height:56vh;margin:0 auto 12px;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink)}
.card .cap{font-family:var(--f-pix);font-size:10px;text-align:center;margin:0}
.fallback{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:26px;font-family:var(--f-pix);font-size:10px;line-height:1.8}
#wipe{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none;image-rendering:pixelated}
#wipeTxt{position:fixed;inset:0;z-index:91;display:grid;place-items:center;margin:0;font-family:var(--f-pix);font-size:clamp(20px,6vw,40px);color:var(--yellow);text-shadow:4px 4px 0 #b13e53;opacity:0;pointer-events:none}
#wipeTxt.on{opacity:1}
#corner{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:70;display:flex;gap:12px}
#fsHint{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:95;font-family:var(--f-pix);font-size:10px;background:var(--yellow);color:var(--ink);padding:10px 12px;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink);animation:blink 1s steps(1) infinite;pointer-events:none}
.scrin{position:relative}
body.game{padding:0;height:100dvh;overflow:hidden}
body.game #app{max-width:none;height:100dvh;margin:0;display:flex;flex-direction:column;
  padding:max(6px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
body.game .era,body.game #title,body.game #note{display:none}
body.game .stage{flex:1;min-height:0;margin:4px}
body.game .stage.tall{height:auto;min-height:0}
body.game .mv{height:100%;display:flex;flex-direction:column}
body.game .cities{padding:6px 10px 6px;margin-right:210px}
body.game .rhead{padding:6px 12px 8px}
body.game .mini{flex:1;min-height:0;display:flex;flex-flow:column wrap;align-content:space-between;column-gap:18px;padding:0 12px 10px;overflow:hidden}
body.game .mini>.scr{flex:0 0 100%;background:transparent}
body.game .mini>:not(.scr){width:var(--side,300px);flex:none}
body.game .mini>.scr+*{margin-top:calc(var(--dlgH,90px) + var(--dlgOff,0px) + 14px)}

body.game .skip{position:fixed;left:16px;bottom:8px;z-index:21;margin:0}
body.game #corner{top:max(8px,env(safe-area-inset-top,0px));bottom:auto}
body.game .nb{padding:10px 12px 12px}
body.game .q{font-size:14px;margin:2px 0 8px}
body.game .btn{font-size:10px;padding:9px 10px}
body.game .btn.opt{font-size:12px;min-width:56px}
body.game .rem,body.game .joke{font-size:15px;min-height:1.4em}
body.game .phone{max-height:46vh;overflow:auto;margin-top:0}
body.game .hbar{padding-top:8px}
body.game .sw{padding-top:6px}body.game .swb{width:30px;height:30px}
.mute{position:static;font-family:var(--f-pix);font-size:9px;background:#000;color:#fff;border:0;padding:10px;
  box-shadow:-3px 0 0 0 var(--fg),3px 0 0 0 var(--fg),0 -3px 0 0 var(--fg),0 3px 0 0 var(--fg)}
.mute[aria-pressed="true"]{color:#6f6590}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="tap" tabindex="0" role="button" aria-label="Başlamak için dokun"><canvas id="tapArt" width="24" height="24"></canvas><p class="t">▶ DOKUN</p><small>SES AÇILACAK</small><small id="rot" hidden>EN İYİSİ: TELEFONU YAN ÇEVİR</small></div>

  <div id="termOut"></div>
  <div id="coinWrap" hidden>

</section>

  <p class="era" id="era"></p>

</section>

<p id="wipeTxt"></p>
<script>

const CONFIG={

  boxes:['OYUNCAKLAR','DEFTERLER','BİSİKLET','BATTANİYE','FOTOĞRAFLAR'],
  walls:[

    {n:'Pembe',   c:'#f3b3c6', j:'Pembe diyorsan pembe. Diploma burada süs.'},

function ctx(){
  const T=[],R_=[];
  return{
    later(f,ms){const id=setTimeout(f,ms);T.push(id);return id},
    loop(fn){let last=performance.now(),id,t=0;const step=now=>{id=requestAnimationFrame(step);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;fn(dt,t,()=>cancelAnimationFrame(id))};id=requestAnimationFrame(step);R_.push(()=>cancelAnimationFrame(id));return()=>cancelAnimationFrame(id)},
    kill(){T.forEach(clearTimeout);R_.forEach(f=>f())}
  };
}
const Music=(()=>{

    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.006);v.gain.setValueAtTime(g,t+d*.55);v.gain.linearRampToValueAtTime(0,t+d);

  function sched(){

      const E=party?E0/1.3:E0;
      for(let i=0;i<8;i++){
        const t=nextT+i*E;
        if(party&&i%2===0){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);v.gain.setValueAtTime(.3,t);v.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(v);v.connect(mus);o.start(t);o.stop(t+.18)}

      }catch(e){}
    },

const SFX=(()=>{

    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(v);v.connect(Music.sfx());o.start(t);o.stop(t+d+.02)}catch(e){}};
  const noise=(d,g,hp)=>{try{if(!Music.on())return;const ac=Music.ac(),t=ac.currentTime;const s=ac.createBufferSource();s.buffer=Music.noise();
    const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1000;const v=ac.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(f);f.connect(v);v.connect(Music.sfx());s.start(t);s.stop(t+d+.02)}catch(e){}};

    key(){tone(240+Math.random()*90,.03,'square',.018)},
    blip(){tone(700,.025,'square',.014)},
    coin(){tone(988,.09,'square',.07);tone(1319,.34,'square',.07,0,.09)},
    ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.07))},
    bad(){tone(220,.18,'square',.05,-100)},
    step(){tone(150,.05,'triangle',.09,-50)},
    ding(){tone(1568,.5,'triangle',.08);tone(1568,.5,'triangle',.06,0,.24)},

    snap(){noise(.08,.16,2500);tone(1800,.05,'square',.03)},

})();

function chain(steps){

    play();

}

function melody(){

    let ac=Music.ac(),own=false;

    const out=ac.createGain();out.gain.value=.5;out.connect(Music.sfx()||ac.destination);
    const P={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99},BS={C3:130.81,G2:98,F2:87.31},U=.19;
    const lead=[['G4',1],['G4',1],['A4',2],['G4',2],['C5',2],['B4',4],[0,2],['G4',1],['G4',1],['A4',2],['G4',2],['D5',2],['C5',4],[0,2],
                ['G4',1],['G4',1],['G5',2],['E5',2],['C5',2],['B4',2],['A4',4],[0,2],['F5',1],['F5',1],['E5',2],['C5',2],['D5',2],['C5',6]];
    const t0=ac.currentTime+.15;
    const b=(f,t,d,type,gain,det)=>{const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(det)o.detune.setValueAtTime(det,t);
      v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(gain,t+.012);v.gain.setValueAtTime(gain,t+d*.5);v.gain.exponentialRampToValueAtTime(.0008,t+d*.96);
      o.connect(v);v.connect(out);o.start(t);o.stop(t+d+.02)};
    let u=0;lead.forEach(([n,len])=>{if(n){const t=t0+u*U,d=len*U*.98;b(P[n],t,d,'square',.13,0);b(P[n],t,d,'square',.05,9)}u+=len});
    const root=x=>x<8?'C3':x<22?'G2':x<36?'C3':x<42?'G2':x<46?'F2':x<50?'C3':x<52?'G2':'C3';
    for(let x=0;x<u;x+=2)b(BS[root(x)],t0+x*U,2*U*.8,'triangle',.15,0);
    if(own)setTimeout(()=>{try{ac.close()}catch(e){}},(u*U+2)*1000);
  }catch(e){}
}
